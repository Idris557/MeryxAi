<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />

        <!-- Google verification --->
        <meta
            name="google-site-verification"
            content="xFMpRMNSQSVodrf_mc2_B9b6kdLOJLklgelGXrAXcKQ"
        />

        <!-- SEO Title & Description -->
        <title>Meryx AI – Smart Gift Recommender for All Occasions</title>
        <meta
            name="description"
            content="Discover the perfect gift for any celebration! Meryx AI recommends thoughtful gifts for birthdays, holidays, Valentine’s Day, Eid, and more."
        />
        <meta
            name="keywords"
            content="Gift Ideas, Gift Recommender, AI Gift Suggestions, Birthday Gifts, Holiday Gifts, Valentine Gifts, Eid Gifts"
        />
        <meta name="robots" content="index, follow" />

        <!-- Open Graph (Social Media)-->
        <meta
            property="og:title"
            content="Meryx AI – Smart Gift Recommender for All Occasions"
        />
        <meta
            property="og:description"
            content="Discover the perfect gift for any celebration! Meryx AI recommends thoughtful gifts for birthdays, holidays, Valentine’s Day, Eid, and more."
        />
        <meta property="og:type" content="website" />
        <meta property="og:url" content="https://meryxai.netlify.app/" />
        <meta property="og:image" content="preview.jpg" />

        <!-- Twitter Card -->
        <meta name="twitter:card" content="summary_large_image" />
        <meta
            name="twitter:title"
            content="Meryx AI – Smart Gift Recommender for All Occasions"
        />
        <meta
            name="twitter:description"
            content="Discover the perfect gift for any celebration! Meryx AI recommends thoughtful gifts for birthdays, holidays, Valentine’s Day, Eid, and more."
        />
        <meta name="twitter:image" content="preview.jpg" />

        <!-- Favicon -->
        <link rel="icon" href="favicon.jpg" type="image/jpeg" />
        <!--- Stylesheet-->
        <link rel="stylesheet" href="style.css" />

        <link
            href="https://fonts.googleapis.com/css2?family=Poppins:wght@600&family=Roboto:wght@400;700&display=swap"
            rel="stylesheet"
        />

        <link
            rel="stylesheet"
            href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.1.0/css/all.css"
            integrity="sha512-ajhUYg8JAATDFejqbeN7KbF2zyPbbqz04dgOLyGcYEk/MJD3V+HJhJLKvJ2VVlqrr4PwHeGTTWxbI+8teA7snw=="
            crossorigin="anonymous"
            referrerpolicy="no-referrer"
        />
    </head>
    <body>
        <header>
            <logo>
                <h1>Meryx AI 🌲</h1>
            </logo>
        </header>
        <div class="container">
            <h1>Christmas Gift Recommender</h1>

            <div class="historyBox" style="margin-bottom: 10px"></div>

            <textarea id="userInput" placeholder="Type something..."></textarea>
            <button id="submitBtn">Ask AI 🎁</button>

            <div id="responseBox">
                <p id="userMessage">AI Suggestions will appear here...</p>
                <p id="aiDisplay"></p>
                <p id="aiResponse" style="display: none"></p>
            </div>

            <button id="copyBtn"><i class="fas fa-copy"></i>Copy</button>
        </div>

        <!--- JavaScript --->
        <script src="index.js"></script>
    </body>
</html>
